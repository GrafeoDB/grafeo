name: CI

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Feature profiles tested in this workflow:
#
# 1. Full profile (--all-features): exercises every language parser (GQL,
#    Cypher, SPARQL, Gremlin, GraphQL, SQL/PGQ), AI features (vector-index,
#    text-index, hybrid-search, cdc), RDF, algorithms, tiered-storage, etc.
#    Used by: rust-check, rust-test, miri, coverage, benchmark-pr.
#
# 2. WASM profile (default-features=false, gql only): minimal feature set
#    for the wasm32-unknown-unknown target, which has no threads or OS APIs.
#    Used by: wasm-build (via scripts/build-wasm.sh).
#
# 3. Default profile (crate defaults, no explicit --features): whatever each
#    binding crate enables in its own Cargo.toml. The Python, Node.js, and Go
#    bindings each pull in "full" through their crate dependencies.
#    Used by: python-test, node-test, go-test.
#
# 4. Shipped profile (grafeo-engine's "full" plus "arrow-export", which the
#    packages' default "embedded" adds; it leaves out "temporal"): the Rust side of what the Python and Node.js packages build. Profile 1
#    turns "temporal" on, which compiles every cfg(not(feature = "temporal"))
#    path out, so clippy and rustdoc for grafeo-core and grafeo-engine, and the
#    grafeo-engine tests, run once more with exactly these features (the
#    feature matrix already runs grafeo-core's tests with them).
#    Used by: shipped-features.
#
# Note: the "embed" feature (ONNX embeddings, ~17 MB) is never included in
# "full" and is not tested here. It is opt-in only.

jobs:
  # Rust checks
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Full profile: --all-features enables all language parsers (GQL, Cypher,
      # SPARQL, Gremlin, GraphQL, SQL/PGQ), AI features (vector-index, text-index,
      # hybrid-search, cdc), RDF, algorithms, and other optional features.
      # This ensures every conditional compilation path compiles without warnings.
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Verify Rust examples compile (all feature profiles)
      - name: Build examples
        run: cargo build -p grafeo-examples --bins --features full

      # Validate that all // ISO: annotations in tests reference valid
      # feature IDs from docs/user-guide/gql/conformance.md.
      - name: Validate GQL conformance annotations
        run: python scripts/gql-conformance.py validate

      # Full profile: generates docs for every feature-gated module so no
      # broken intra-doc links or missing items slip through.
      - name: Check docs
        run: |
          rm -rf target/doc
          cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Spec test streams ──────────────────────────────────────────────
  # Each binding runs its .gtest spec suite on a single runner (ubuntu)
  # after rust-check passes. Fast feedback before the expensive matrix.

  rust-spec:
    name: Rust Spec Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-spec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-spec-
      - name: Run spec tests
        run: cargo test -p grafeo-spec-tests --all-features

  python-spec:
    name: Python Spec Tests
    needs: [rust-check, rust-spec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pyspec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pyspec-
      - name: Build and install
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m crates/bindings/python/Cargo.toml
          sccache: 'true'
      - name: Install package
        run: |
          uv pip install --system dist/*.whl
          uv pip install --system pytest pyyaml
      - name: Run spec tests
        run: pytest tests/spec/ -v

  node-spec:
    name: Node.js Spec Tests
    needs: [rust-check, rust-spec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nodespec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nodespec-
      - name: Build native module
        working-directory: crates/bindings/node
        run: |
          npm install
          npm run build
      - name: Run spec tests
        run: npx vitest run tests/spec/runners/node/spec-runner.test.mjs

  go-spec:
    name: Go Spec Tests
    needs: [rust-check, rust-spec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gospec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gospec-
      - name: Build shared library
        run: cargo build --release -p grafeo-c --features full
      - name: Run spec tests
        working-directory: tests/spec/runners/go
        run: |
          cp ../../../../target/release/libgrafeo_c.so .
          CGO_ENABLED=1 CGO_LDFLAGS="-L. -lgrafeo_c -lm -ldl -lpthread" LD_LIBRARY_PATH=. go test -count=1 -run TestSpec -timeout 120s -v

  csharp-spec:
    name: C# Spec Tests
    needs: [rust-check, rust-spec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-csspec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-csspec-
      - name: Build shared library
        run: cargo build --release -p grafeo-c --features full
      - name: Copy library
        run: cp target/release/libgrafeo_c.so tests/spec/runners/csharp/
      - name: Run spec tests
        working-directory: tests/spec/runners/csharp
        run: dotnet test --verbosity minimal
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/tests/spec/runners/csharp

  dart-spec:
    name: Dart Spec Tests
    needs: [rust-check, rust-spec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dartspec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-dartspec-
      - name: Build shared library
        run: cargo build --release -p grafeo-c --features full
      - name: Copy library
        run: cp target/release/libgrafeo_c.so crates/bindings/dart/
      - name: Run spec tests
        working-directory: tests/spec/runners/dart
        run: |
          dart pub get
          dart test spec_runner_test.dart
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/crates/bindings/dart

  wasm-spec:
    name: WASM Spec Tests
    needs: [rust-check, rust-spec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall wasm-bindgen-cli@0.2.118 --no-confirm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasmspec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasmspec-
      - name: Build WASM
        run: bash scripts/build-wasm.sh
      - name: Run spec tests
        working-directory: tests/spec/runners/wasm
        run: |
          npm install
          npx vitest run

  # ── Full test matrices (gated by rust-check) ────────────────────

  # Rust tests (debug, all platforms)
  rust-test:
    name: Rust Test (${{ matrix.os }})
    needs: [rust-check, supply-chain]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Every test binary of the debug build links the whole engine, which
      # nearly fills an ubuntu runner's disk: remove preinstalled SDKs that
      # this job does not use.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Crate sources only: archiving this job's target directory filled the
      # runner's disk, and sccache keeps the compiled crates between runs.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Full profile: --all-features tests every language parser, AI index,
      # RDF store, algorithms, CDC, and other optional modules together.
      # This catches integration issues across feature combinations.
      # Spec tests are excluded here as they run in the dedicated rust-spec job.
      # Line tables keep file and line in backtraces at a fraction of the size
      # of full debug info.
      - name: Run tests
        run: cargo nextest run --all-features --workspace --exclude grafeo-spec-tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

      # nextest does not run doc-tests, so run them separately
      - name: Run doc-tests
        run: cargo test --all-features --workspace --doc
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

  # Tests that need a minimal feature set, so they are covered outside
  # --all-features too: encryption at rest with only the features it needs,
  # the migration of 0.5.x files in a build without `wal` (the default
  # `embedded` profile of the Node.js, C, Go, C# and Dart bindings), the
  # refusal of 0.5.x files in a build without `lpg`, the migration of files
  # compacted by 0.5.x in a build without the old `compact-store` feature (the
  # `grafeo` crate, the CLI), the refusal of files with data a build cannot
  # read: triples without `triple-store` (in the file, its WAL or a 0.5.x WAL directory, so also with
  # `wal`) and vector and text indexes without `vector-index` and `text-index`
  # (the engine's default build, the CLI), and of snapshots with such triples
  # or indexes (import and restore), and RDF triples that survive a reopen and
  # a crash in the feature matrix's `rdf` engine build (#544). A job of its
  # own: the rust-test runners are near their disk limit, and these are extra
  # engine builds.
  minimal-features:
    name: Minimal Features
    needs: [rust-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Test encryption at rest, triples in a WAL without triple-store, epochs across a reopen without temporal
        run: cargo nextest run -p grafeo-engine --no-default-features --features lpg,gql,wal,grafeo-file,encryption --test encryption_at_rest --test rdf_file_without_triple_store --test epochs_across_reopen
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

      - name: Test migration and close without the wal feature, files and snapshots with data this build cannot read, functions without their features
        run: cargo nextest run -p grafeo-engine --no-default-features --features lpg,gql,grafeo-file --test migration_without_wal --test writes_after_close --test compacted_file_in_every_build --test rdf_file_without_triple_store --test search_indexes_without_their_features --test snapshot_without_its_features --test functions_without_their_features
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

      - name: Test 0.5.x files without the lpg feature
        run: cargo nextest run -p grafeo-engine --no-default-features --features gql,grafeo-file,wal --test legacy_without_lpg
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

      # The engine features of the feature matrix's `rdf` profile, which name
      # no `lpg`: `triple-store` brings it (#544).
      - name: Test RDF persistence with the rdf engine features
        run: cargo nextest run -p grafeo-engine --no-default-features --features gql,sparql,graphql,triple-store,shacl,wal,grafeo-file,spill,mmap,regex,testing-crash-injection --test rdf_persistence
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

  # The shipped profile (4 above): grafeo-engine's `full` features, which the
  # Python and Node.js packages build, without `temporal`. --all-features turns
  # `temporal` on and so leaves out code these packages run: this job lints and
  # documents it, and runs the engine's tests (rust-feature-matrix already runs
  # grafeo-core's tests with this set). One OS and a debug build, as the code differs by
  # feature, not by platform. `grafeo-engine/full` also sets grafeo-core's
  # features, so both crates build with exactly the shipped set.
  shipped-features:
    name: Shipped Features
    needs: [rust-check]
    runs-on: ubuntu-latest
    steps:
      # The engine's test binaries in a debug build nearly fill an ubuntu
      # runner's disk (see rust-test): remove preinstalled SDKs that this job
      # does not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Run clippy (shipped profile)
        run: cargo clippy -p grafeo-core -p grafeo-engine --all-targets --features grafeo-engine/full,grafeo-engine/arrow-export -- -D warnings

      - name: Check docs (shipped profile)
        run: cargo doc --no-deps -p grafeo-core -p grafeo-engine --features grafeo-engine/full,grafeo-engine/arrow-export
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Run tests (shipped profile)
        run: cargo nextest run -p grafeo-engine --features grafeo-engine/full,grafeo-engine/arrow-export
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

      # The spilled-embedding tests that need more than the shipped set: an
      # encrypted database never spills, and the crash sweeps of the legacy
      # spill fold-in and the migration need crash injection.
      - name: Run spill tests with encryption and crash injection (shipped profile)
        run: >
          cargo nextest run -p grafeo-engine
          --features grafeo-engine/full,grafeo-engine/arrow-export,grafeo-engine/encryption,grafeo-engine/testing-crash-injection
          --test spilled_embeddings --test legacy_spill --test migration
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

  # Rust tests (release, ubuntu only)
  # Release-mode catches issues from inlining and overflow checks.
  # These bugs are platform-independent, so one OS is sufficient.
  rust-test-release:
    name: Rust Test (release)
    needs: [rust-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Run tests (release)
        run: cargo nextest run --all-features --workspace --exclude grafeo-spec-tests --release
        env:
          RUSTC_WRAPPER: sccache

      - name: Run doc-tests (release)
        run: cargo test --all-features --workspace --doc --release
        env:
          RUSTC_WRAPPER: sccache

  # Feature matrix: test individual feature combinations that --all-features
  # masks. Catches per-feature cfg bugs, missing imports, and conditional
  # compilation issues. Runs on ubuntu only (feature bugs are OS-independent).
  rust-feature-matrix:
    name: Feature Matrix (${{ matrix.profile }})
    needs: [rust-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GQL-only: minimal viable config (no AI, no RDF, no extra languages)
          - profile: gql-only
            features: "--features gql"
          # LPG persona: Graph App Developer (LPG model + all LPG query languages)
          - profile: lpg
            features: "--features lpg,gql,cypher,gremlin,sql-pgq,spill,mmap,regex"
            engine_features: "--features lpg,gql,cypher,gremlin,sql-pgq,wal,grafeo-file,spill,mmap,regex"
          # RDF persona: Knowledge Engineer (RDF model + SPARQL/GraphQL + SHACL)
          - profile: rdf
            features: "--features gql,sparql,graphql,triple-store,spill,mmap,regex"
            engine_features: "--features gql,sparql,graphql,triple-store,shacl,wal,grafeo-file,spill,mmap,regex"
            # The facade's `rdf` profile on its own keeps its data across a reopen (#544).
            facade_test: "--features rdf --test rdf_profile"
          # Analytics persona: Data Scientist (algorithms + search + bulk import)
          - profile: analytics
            features: "--features algos,vector-index,text-index,hybrid-search,jsonl-import,parquet-import"
            engine_features: "--features algos,vector-index,text-index,hybrid-search,jsonl-import,parquet-import"
          # AI persona: AI/Agent Developer (search + change tracking)
          - profile: ai
            features: "--features vector-index,text-index,hybrid-search"
            engine_features: "--features vector-index,text-index,hybrid-search,cdc"
          # Edge persona: Frontend/Edge Developer (minimal WASM-friendly)
          - profile: edge
            features: "--features lpg,gql,regex-lite"
            engine_features: "--features lpg,gql,regex-lite"
          # Enterprise persona: Platform Operator (observability + async I/O)
          - profile: enterprise
            features: "--features tracing"
            engine_features: "--features metrics,tracing,async-storage"
          # Full: all features combined (`full` is a deprecated alias, removed in 0.7.0 per #468; use persona combos)
          - profile: full
            features: "--features lpg,languages,triple-store,algos,parallel,vector-index,text-index,hybrid-search,spill,mmap,regex,jsonl-import,parquet-import"
            engine_features: "--features full"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-${{ matrix.profile }}-

      # Build + test the foundation crates (common, core, adapters) which have
      # proper #[cfg] gates on all tests. This catches per-feature regressions
      # in both library and test code.
      - name: Build + test foundation (${{ matrix.profile }})
        run: >
          cargo nextest run
          -p grafeo-common
          -p grafeo-core
          -p grafeo-adapters
          --no-default-features ${{ matrix.features }}
        env:
          RUSTC_WRAPPER: sccache

      # Library-only build for the engine crate: its integration tests assume
      # all features are available and need incremental cfg-gating (tracked).
      # Full test coverage runs under --all-features in the rust-test job.
      # Uses engine_features when the profile name differs from foundation features
      # (e.g. "embedded" and "browser" are engine-level profile names).
      - name: Build engine + facade (${{ matrix.profile }})
        run: >
          cargo build --lib
          -p grafeo-engine
          -p grafeo
          --no-default-features ${{ matrix.engine_features || matrix.features }}
        env:
          RUSTC_WRAPPER: sccache

      # A facade test built with only the profile's features, for profiles
      # whose behavior depends on what the profile itself enables.
      - name: Test facade profile (${{ matrix.profile }})
        if: matrix.facade_test
        run: >
          cargo test
          -p grafeo
          --no-default-features ${{ matrix.facade_test }}
        env:
          RUSTC_WRAPPER: sccache

  # Miri undefined behavior check
  miri:
    name: Miri UB Check
    runs-on: ubuntu-latest
    # Pinned nightly, so a Miri change cannot break CI unannounced. Cargo refuses a
    # toolchain older than `rust-version`, so the nightly's rustc must be at least
    # the MSRV: bump this pin together with `rust-version` in Cargo.toml.
    env:
      NIGHTLY: nightly-2026-10-03
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: miri

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-miri-${{ env.NIGHTLY }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-miri-${{ env.NIGHTLY }}-

      - name: Setup Miri sysroot
        run: cargo +$NIGHTLY miri setup

      # Full profile: tests grafeo-common with all features under Miri to
      # verify no undefined behavior in the foundation crate (allocators,
      # hashing, MVCC types) regardless of which features are active.
      - name: Run Miri on grafeo-common
        run: cargo +$NIGHTLY miri test --all-features -p grafeo-common
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      # Instrumented test binaries fill the runner's disk, and the linker
      # then dies with a bus error: remove preinstalled SDKs that this job
      # does not use, as rust-test does (see also the debug info below).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Full profile: --all-features ensures coverage includes all language
      # parsers, AI features, and optional modules. Binding crates, build
      # scripts, test helpers, and benchmarks are excluded from the report.
      # Line tables only, as in rust-test: the report comes from the coverage
      # mapping the instrumentation embeds, not from debug info, and full
      # debug info in every instrumented test binary ran the runner out of
      # disk space.
      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex '(crates/bindings/|build\.rs|tests/|benches/)'
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

  # Python tests
  # Release profile: maturin builds grafeo-python with the feature list of
  # pyproject.toml ("full": all languages + AI), like the published wheels.
  python-test:
    name: Python Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [python-spec]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          # Takes the newest release candidate until the setup-python manifest lists a final release.
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Build Python wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m crates/bindings/python/Cargo.toml
          sccache: 'true'

      - name: Install Python package and test dependencies
        shell: bash
        run: |
          uv pip install --system dist/*.whl
          uv pip install --system pytest pytest-asyncio networkx numpy scipy solvor

      - name: Run Python tests
        env:
          # The wheel above has the release features: check every language is in.
          GRAFEO_RELEASE_BUILD: "1"
        run: pytest crates/bindings/python/tests/ -v --ignore=crates/bindings/python/tests/benchmark_phases.py

  # Node.js tests
  # Default profile: napi-rs builds grafeo-node with its crate-level default
  # features, which pull in "full" (all languages + AI) via grafeo-engine.
  node-test:
    name: Node.js Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [node-spec]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-node-

      - name: Install dependencies
        working-directory: crates/bindings/node
        run: npm install

      - name: Build native module
        working-directory: crates/bindings/node
        run: npm run build

      - name: Run tests
        working-directory: crates/bindings/node
        run: npm test

  # Go tests
  # Default profile: grafeo-c is built with --features full explicitly (see
  # the "Build shared library" step), so the Go FFI tests the full API surface.
  go-test:
    name: Go Test (${{ matrix.os }})
    needs: [go-spec]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-go-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-go-

      # Full profile (via "full" feature group): builds with all language
      # parsers and AI features so the C FFI exposes the complete API surface.
      # Go bindings call through this shared library.
      - name: Build shared library
        run: cargo build --release -p grafeo-c --features full

      - name: Copy library and run tests (Linux)
        if: runner.os == 'Linux'
        working-directory: crates/bindings/go
        run: |
          cp ../../../target/release/libgrafeo_c.so .
          CGO_ENABLED=1 CGO_LDFLAGS="-L. -lgrafeo_c -lm -ldl -lpthread" LD_LIBRARY_PATH=. go test -v ./...

      - name: Copy library and run tests (macOS)
        if: runner.os == 'macOS'
        working-directory: crates/bindings/go
        run: |
          cp ../../../target/release/libgrafeo_c.dylib .
          CGO_ENABLED=1 CGO_LDFLAGS="-L. -lgrafeo_c -lm -ldl -lpthread -framework Security" DYLD_LIBRARY_PATH=. go test -v ./...

      - name: Copy library and run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: crates/bindings/go
        shell: bash
        run: |
          cp ../../../target/release/grafeo_c.dll .
          cp ../../../target/release/grafeo_c.dll.lib .
          CGO_ENABLED=1 CGO_LDFLAGS="-L. -lgrafeo_c -lws2_32 -lbcrypt -lntdll -luserenv" go test -v ./...

  csharp-test:
    name: C# Test (${{ matrix.os }})
    needs: [csharp-spec]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-csharp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-csharp-

      # Full profile: builds with all language parsers and AI features so the
      # C FFI exposes the complete API surface for the C# bindings.
      - name: Build shared library
        run: cargo build --release -p grafeo-c --features full

      - name: Copy library (Linux)
        if: runner.os == 'Linux'
        run: cp target/release/libgrafeo_c.so crates/bindings/csharp/tests/Grafeo.Tests/

      - name: Copy library (macOS)
        if: runner.os == 'macOS'
        run: cp target/release/libgrafeo_c.dylib crates/bindings/csharp/tests/Grafeo.Tests/

      - name: Copy library (Windows)
        if: runner.os == 'Windows'
        run: copy target\release\grafeo_c.dll crates\bindings\csharp\tests\Grafeo.Tests\

      - name: Restore
        run: dotnet restore
        working-directory: crates/bindings/csharp

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: crates/bindings/csharp

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: crates/bindings/csharp
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/crates/bindings/csharp/tests/Grafeo.Tests
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/crates/bindings/csharp/tests/Grafeo.Tests

  # Dart tests
  # Default profile: grafeo-c is built with --features full explicitly,
  # so the Dart FFI tests exercise the complete C API surface.
  dart-test:
    name: Dart Test (${{ matrix.os }})
    needs: [dart-spec]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dart-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dart-

      - name: Build shared library
        run: cargo build --release -p grafeo-c --features full

      - name: Copy library (Linux)
        if: runner.os == 'Linux'
        run: cp target/release/libgrafeo_c.so crates/bindings/dart/

      - name: Copy library (macOS)
        if: runner.os == 'macOS'
        run: cp target/release/libgrafeo_c.dylib crates/bindings/dart/

      - name: Copy library (Windows)
        if: runner.os == 'Windows'
        run: copy target\release\grafeo_c.dll crates\bindings\dart\

      - name: Install dependencies
        working-directory: crates/bindings/dart
        run: dart pub get

      - name: Analyze
        working-directory: crates/bindings/dart
        run: dart analyze --fatal-infos

      - name: Run tests
        working-directory: crates/bindings/dart
        run: dart test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/crates/bindings/dart
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/crates/bindings/dart

  # WASM build
  # WASM profile: builds with default-features = false and only the "gql"
  # feature enabled (minimal, no threads). The wasm32-unknown-unknown target
  # has no std::thread, so threading features, jemalloc/mimalloc allocators,
  # and other OS-dependent code are excluded. The build script
  # (scripts/build-wasm.sh) handles the exact cargo flags.
  wasm-build:
    name: WASM Build
    needs: [wasm-spec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall wasm-bindgen-cli@0.2.118 --no-confirm

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      # WASM profile: delegates to build-wasm.sh which compiles grafeo-wasm
      # with only the gql feature (no threads, no native allocators).
      - name: Build WASM
        run: bash scripts/build-wasm.sh

      - name: Check gzip size
        run: |
          SIZE=$(gzip -c crates/bindings/wasm/pkg/grafeo_wasm_bg.wasm | wc -c)
          echo "WASM gzip size: $SIZE bytes ($(( SIZE / 1024 )) KB)"
          if [ "$SIZE" -gt 409600 ]; then echo "::warning::WASM exceeds 400KB gzip target"; fi

  # Benchmark regression check (PR only, same-runner comparison)
  #
  # Runs both base and PR benchmarks on the same runner to eliminate
  # hardware variance from shared GitHub Actions VMs. Uses Criterion's
  # --save-baseline to store results, then critcmp to compare.
  benchmark-pr:
    name: Benchmark (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Need full history to checkout base commit

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Install critcmp
        run: cargo install critcmp --locked

      # Run base benchmarks first. Any CPU thermal warming benefits
      # the PR run, making regressions easier to detect.
      - name: Checkout base
        run: git checkout ${{ github.event.pull_request.base.sha }}

      # Full profile: --all-features benchmarks include feature-gated indexes
      # (vector, text, ring) so perf regressions are caught across all modules.
      - name: Bench base
        run: |
          cargo bench --all-features -p grafeo-common --bench arena_bench -- --save-baseline base --noplot
          cargo bench --all-features -p grafeo-core --bench index_bench -- --save-baseline base --noplot
          ENGINE_BENCHES="--bench query_bench --bench serialization_bench"
          [ -f crates/grafeo-engine/benches/regression_bench.rs ] && ENGINE_BENCHES="$ENGINE_BENCHES --bench regression_bench"
          [ -f crates/grafeo-engine/benches/memory_bench.rs ] && ENGINE_BENCHES="$ENGINE_BENCHES --bench memory_bench"
          cargo bench --all-features -p grafeo-engine $ENGINE_BENCHES -- --save-baseline base --noplot

      - name: Save base memory snapshot
        run: |
          if [ -f target/criterion/memory_snapshot.json ]; then
            cp target/criterion/memory_snapshot.json target/criterion/memory_snapshot_base.json
          fi

      - name: Checkout PR head
        run: git checkout ${{ github.event.pull_request.head.sha }}

      - name: Bench PR
        run: |
          cargo bench --all-features -p grafeo-common --bench arena_bench -- --save-baseline pr --noplot
          cargo bench --all-features -p grafeo-core --bench index_bench -- --save-baseline pr --noplot
          ENGINE_BENCHES="--bench query_bench --bench serialization_bench"
          [ -f crates/grafeo-engine/benches/regression_bench.rs ] && ENGINE_BENCHES="$ENGINE_BENCHES --bench regression_bench"
          [ -f crates/grafeo-engine/benches/memory_bench.rs ] && ENGINE_BENCHES="$ENGINE_BENCHES --bench memory_bench"
          cargo bench --all-features -p grafeo-engine $ENGINE_BENCHES -- --save-baseline pr --noplot

      - name: Compare and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bench-compare.sh base pr bench-thresholds.toml ${{ github.event.pull_request.number }}

  # Benchmark baseline persistence (main branch only)
  #
  # Runs on push to main and caches the baseline for future PR comparisons.
  # This enables trend detection across releases.
  benchmark-main:
    name: Benchmark (main baseline)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run all benchmarks
        run: |
          cargo bench --all-features -p grafeo-common --bench arena_bench -- --save-baseline main --noplot
          cargo bench --all-features -p grafeo-core --bench index_bench -- --save-baseline main --noplot
          ENGINE_BENCHES="--bench query_bench --bench serialization_bench"
          [ -f crates/grafeo-engine/benches/regression_bench.rs ] && ENGINE_BENCHES="$ENGINE_BENCHES --bench regression_bench"
          [ -f crates/grafeo-engine/benches/memory_bench.rs ] && ENGINE_BENCHES="$ENGINE_BENCHES --bench memory_bench"
          cargo bench --all-features -p grafeo-engine $ENGINE_BENCHES -- --save-baseline main --noplot

      - name: Save baseline cache
        uses: actions/cache/save@v6
        with:
          path: target/criterion
          key: grafeo-bench-main-${{ github.sha }}

  # Supply chain security (licenses, advisories, bans, sources)
  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # Verify declared MSRV compiles
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Check compilation with MSRV
        # Explicit `+1.99.0` so rust-toolchain.toml does not override the MSRV toolchain
        run: cargo +1.99.0 check --workspace --all-features

  # Typo detection
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: crate-ci/typos@v1.50.3

  # Repository policy (scripts/check_policy.py): crate boundaries from cargo metadata,
  # workflow toolchain pins that match rust-toolchain.toml and the MSRV, and the
  # public-text rules, plus the script's own tests. Rules on added lines run locally
  # (prek) and on pull requests.
  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - name: Whole-tree rules
        run: python scripts/check_policy.py tree
      - name: Policy script tests
        run: |
          uv pip install --system pytest
          pytest scripts/tests -q

  # The one check to require on main and release/*: fails when any job it needs failed
  # or was cancelled. Skipped jobs pass (they skip when an earlier job already failed,
  # which fails this gate through that job). Coverage and benchmarks stay informational.
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - rust-check
      - rust-spec
      - python-spec
      - node-spec
      - go-spec
      - csharp-spec
      - dart-spec
      - wasm-spec
      - rust-test
      - rust-test-release
      - minimal-features
      - shipped-features
      - rust-feature-matrix
      - miri
      - python-test
      - node-test
      - go-test
      - csharp-test
      - dart-test
      - wasm-build
      - supply-chain
      - msrv
      - typos
      - policy
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Required jobs failed or were cancelled: $(echo $failed | tr '\n' ' ')"
            exit 1
          fi
