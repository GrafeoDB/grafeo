name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow CodSpeed to trigger backtest performance analysis
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          cache-target: release
          bins: cargo-codspeed

      - name: Build the benchmark targets
        run: |
          cargo codspeed build --all-features \
            -p grafeo-common --bench arena_bench \
            -p grafeo-core --bench index_bench \
                           --bench store_apply \
            -p grafeo-engine --bench query_bench \
                             --bench serialization_bench \
                             --bench regression_bench \
                             --bench write_path_bench

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        env:
          # The write-path bench at a tenth of its sizes: simulation counts
          # instructions, so smaller batches keep the run short.
          GRAFEO_BENCH_SCALE: '10'
        with:
          mode: simulation
          run: cargo codspeed run
