name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: false

  # Build Node.js native modules for each published platform
  build-node-native:
    name: Node.js (${{ matrix.target }})
    runs-on: ${{ matrix.host }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 (x64 host) is retired; cross-compile x64 from the arm64 runner
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: crates/bindings/node
        run: npm install

      - name: Build native module
        working-directory: crates/bindings/node
        run: npx napi build --platform --release --target ${{ matrix.target }} --features full

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-bindings-${{ matrix.target }}
          path: crates/bindings/node/grafeo.*.node
          if-no-files-found: error

  # Publish Node.js platform packages and main package to npm
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [create-release, build-node-native]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: crates/bindings/node
        run: npm install

      - name: Download all Node.js artifacts
        uses: actions/download-artifact@v8
        with:
          path: crates/bindings/node/artifacts
          pattern: node-bindings-*
          merge-multiple: true

      - name: Move artifacts to npm directories
        working-directory: crates/bindings/node
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/
          # Copy .node files to cwd where napi artifacts expects them
          cp artifacts/grafeo.*.node .
          npx napi artifacts --npm-dir npm
          echo "=== Platform packages ==="
          find npm -name '*.node' -ls

      - name: Publish platform packages
        working-directory: crates/bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            if ls "$dir"*.node 1>/dev/null 2>&1; then
              echo "Publishing $(basename "$dir")..."
              (cd "$dir" && npm publish --access public)
            fi
          done

      - name: Publish @react-querybuilder/grafeo
        working-directory: crates/bindings/node
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
