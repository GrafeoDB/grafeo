# typos configuration
# https://github.com/crate-ci/typos

[files]
extend-exclude = [
    ".venv/",
    "target/",
    "*.lock",
    ".benchmarks/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    # LDBC SNB test data, copied verbatim: generated text with truncated words, DBpedia names
    "tests/spec/datasets/ldbc_snb_mini.setup",
    "tests/spec/lpg/*/ldbc_snb_interactive.gtest",
    # Font licences, copied verbatim (they name the variable font axes, such as wdth)
    "docs/stylesheets/fonts/OFL-*.txt",
]

[default]
extend-ignore-re = [
    # Result fingerprints in the differential test's reviewed lists are hex digests, not words
    '(?m)^[A-Z]+[0-9]+\|[a-z]+ [0-9a-f]{10} ',
    # Unicode code points in the docs stylesheet's unicode-range (U+02BA is not a word)
    'U\+[0-9A-Fa-f]{2,6}(?:-[0-9A-Fa-f]{2,6})?',
]

[default.extend-words]
# "utiliz" = the stem in the docs tone checker's buzzword pattern (utiliz(?:e|es|ed|ing))
utiliz = "utiliz"
# "flate" (flate2) = the gzip crate the parquet reader names in its error for gzip files
flate = "flate"
# "fof" = friend-of-friend (standard graph query pattern)
fof = "fof"
fofName = "fofName"
# "ue" appears in test comment "key=val=ue" (split-at-first-equals test)
ue = "ue"
# "$nin" = "not in" filter operator (MongoDB-style)
nin = "nin"
# "hel" = intentional property name for prefix-matching test (alongside "hello")
hel = "hel"
# "caf" = "café" written with a Unicode escape in tests (caf\u{e9}, café)
caf = "caf"
# "STIRNG" = a deliberate typo of STRING: type DDL tests check that an unknown type name is refused
STIRNG = "STIRNG"
# "nce" = a fragment of a regular expression in a difftest case (`.*(lix|nce).*`, Vincent)
nce = "nce"
# "coutn", "lenght" = deliberate misspellings that unknown-function tests check the "Did you mean" hint with
coutn = "coutn"
lenght = "lenght"

[default.extend-identifiers]
abd = "abd"         # Levenshtein distance test input
Plase = "Plase"     # fuzzy-match test input
INSERTs = "INSERTs" # plural of SQL INSERT keyword
