[package]
name = "grafeo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for Grafeo graph database"

[[bin]]
name = "grafeo"
path = "src/main.rs"
doc = false

[dependencies]
grafeo-engine = { workspace = true, features = ["storage", "parallel", "regex", "tracing"] }
grafeo-common = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Output formatting
comfy-table = "8"
serde = { workspace = true }
serde_json = "1"
is-terminal = "0.4"

# REPL
rustyline = "18"

# Progress bars
indicatif = "0.18"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["lpg", "gql", "jsonl-import"]
lpg = ["grafeo-engine/lpg"]
gql = ["grafeo-engine/gql"]
cypher = ["grafeo-engine/cypher"]
sparql = ["grafeo-engine/sparql"]
gremlin = ["grafeo-engine/gremlin"]
graphql = ["grafeo-engine/graphql"]
sql-pgq = ["grafeo-engine/sql-pgq"]
triple-store = ["grafeo-engine/triple-store"]
rdf = ["triple-store"]  # Deprecated: use triple-store
algos = ["grafeo-engine/algos"]
vector-index = ["grafeo-engine/vector-index"]
text-index = ["grafeo-engine/text-index"]
hybrid-search = ["grafeo-engine/hybrid-search"]
cdc = ["grafeo-engine/cdc"]
arrow-export = ["grafeo-engine/arrow-export"]
jsonl-import = ["grafeo-engine/jsonl-import"]
languages = ["gql", "cypher", "sparql", "gremlin", "graphql", "sql-pgq"]
ai = ["vector-index", "text-index", "hybrid-search", "cdc"]
storage = ["grafeo-engine/storage"]
# Named profiles
embedded = ["lpg", "gql", "ai", "algos", "jsonl-import", "grafeo-engine/parallel", "grafeo-engine/regex"]
full = ["lpg", "languages", "ai", "algos", "triple-store", "jsonl-import"]

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
