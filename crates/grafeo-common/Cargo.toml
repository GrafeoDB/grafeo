[package]
name = "grafeo-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Common types, memory allocators, and utilities for Grafeo"
autotests = false

[dependencies]
# Error handling
thiserror.workspace = true

# Data structures
smallvec.workspace = true
bumpalo.workspace = true
hashbrown.workspace = true
dashmap.workspace = true
indexmap.workspace = true
arcstr.workspace = true

# Hashing
foldhash.workspace = true

# Serialization
serde.workspace = true
bincode.workspace = true
bytes.workspace = true

# Concurrency
parking_lot.workspace = true

# The seed of the random functions, from the operating system's entropy
# (the `os-entropy` feature)
getrandom = { workspace = true, optional = true }

# Observability (optional)
tracing = { workspace = true, optional = true }

# Encryption (optional, behind `encryption` feature)
aes-gcm = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

# The host's clock on wasm32, where std::time::SystemTime::now() panics
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

# The memory this process may use (memory::system): the physical memory and the job object's
# limits on Windows, `hw.memsize` on macOS
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[features]
default = []
tiered-storage = []  # Deprecated since 0.6.0: enables nothing (LpgStore, its only user, is gone); removed in 0.7.0
temporal = []  # Deprecated since 0.6.0: enables nothing (LpgStore, its only user, is gone); removed in 0.7.0
tracing = ["dep:tracing"]
testing-crash-injection = []
testing-statement-injection = []
# `Warning::Probe` (01Z99), the notice the warning channel's tests raise.
testing-warning-probe = []
# RDF term fixtures (`types::rdf::testing`) for the tests of crates that depend on this one.
testing-rdf-terms = []
# The seed of the random functions (`utils::random`) from the operating
# system's entropy. grafeo-core turns it on for every native target; in WASM
# the binding does, as getrandom there needs its `wasm_js` backend, which only
# an application can choose. Without it the seed is the clock and the hasher
# keys of std (see `utils::random`).
os-entropy = ["dep:getrandom"]
encryption = ["dep:aes-gcm", "dep:hkdf", "dep:argon2", "dep:zeroize", "dep:sha2", "dep:rand"]

[dev-dependencies]
num-bigint.workspace = true
proptest.workspace = true
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "arena_bench"
harness = false

# One integration test binary (tests/main.rs declares each test file as a module).
[[test]]
name = "main"
path = "tests/main.rs"

# Counts allocations with its own global allocator.
[[test]]
name = "log_record_decode_bound"
path = "tests/log_record_decode_bound.rs"

# Counts allocations with its own global allocator.
[[test]]
name = "log_record_memory"
path = "tests/log_record_memory.rs"
