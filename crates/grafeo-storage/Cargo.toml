[package]
name = "grafeo-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Persistence layer for Grafeo: WAL, container format, section I/O"
autotests = false

[dependencies]
grafeo-common.workspace = true

# Error handling
thiserror.workspace = true

# Serialization
serde.workspace = true
bincode.workspace = true
bytes.workspace = true

# Concurrency
parking_lot.workspace = true

# Checksums (always needed for section directory CRC)
crc32fast.workspace = true

# I/O (optional, feature-gated)
memmap2 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }

# Async (optional)
tokio = { workspace = true, optional = true }

# Tracing (optional, zero-cost when disabled)
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"
criterion.workspace = true

[[bench]]
name = "wal_bench"
harness = false
required-features = ["wal"]

[features]
default = ["wal"]
wal = ["memmap2"]
async-storage = ["wal", "tokio"]  # Deprecated since 0.6.1 with the engine feature of the same name; removed in 0.7.0
grafeo-file = ["wal", "fs2"]
tracing = ["dep:tracing", "grafeo-common/tracing"]
testing-crash-injection = ["grafeo-common/testing-crash-injection"]
encryption = ["grafeo-common/encryption"]

[lints]
workspace = true

# One integration test binary (tests/main.rs declares each test file as a module).
[[test]]
name = "main"
path = "tests/main.rs"

# Counts allocations with its own global allocator.
[[test]]
name = "wal_v2_memory"
path = "tests/wal_v2_memory.rs"
