# Pinned so local builds and CI use the same compiler and clippy lint set.
# Bump deliberately (and fix new lints in the same change) instead of tracking `stable`.
# The MSRV check in CI uses `cargo +1.91.1` explicitly and is not affected by this file.
[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy"]
profile = "minimal"
