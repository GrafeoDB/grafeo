# openCypher TCK cases Grafeo does not pass yet, by feature file.
#
# scripts/convert_opencypher_tck.py reads this file:
# - `issue` (with a `note`): the case is a strict expected failure until the fix lands;
#   `passes_in` names runners where it passes all the same.
# - `reason` ("out-of-scope" or "spec-disagreement", with a `note`): the case is left out,
#   and the feature's .gtest header says why.
# - `gql_class` (with a `note`): GQL's General Rules give another GQLSTATUS class than the
#   TCK's for this case; the case expects GQL's class and says so in a comment.
# An entry that names no case stops the conversion.

