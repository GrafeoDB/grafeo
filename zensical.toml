# docs.grafeo.dev: built with Zensical from docs/ (zensical build --strict, output in site/).
# The look is the Grafeo identity: docs/stylesheets/extra.css and the font, logo and palette
# blocks below come from the Grafeo design tokens (do not edit them by hand); the site's own
# rules live in docs/stylesheets/grafeo.css.

[project]
site_name = "Grafeo"
site_description = "A high-performance, embeddable graph database with a Rust core and no required C dependencies. Python, Node.js, Go, WebAssembly, C#/.NET and Dart bindings. Supports LPG and RDF data models, multiple query languages (GQL, Cypher, Gremlin, GraphQL, SPARQL, SQL/PGQ), ACID transactions and extensible storage backends."
site_author = "S.T. Grond"
site_url = "https://grafeo.dev/"
repo_url = "https://github.com/GrafeoDB/grafeo"
repo_name = "GrafeoDB/grafeo"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 S.T. Grond - Apache-2.0 License"
docs_dir = "docs"
extra_css = ["stylesheets/extra.css", "stylesheets/grafeo.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]
